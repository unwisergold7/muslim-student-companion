<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="180" fill="#064E3B"/>
  <!-- Lantern body -->
  <rect x="387" y="340" width="250" height="320" rx="18" fill="#065F46"/>
  <rect x="387" y="340" width="250" height="320" rx="18" fill="none" stroke="#D4A574" stroke-width="10"/>
  <!-- Crescent moon inside lantern -->
  <path d="M560 430 A90 90 0 1 1 480 550 A65 65 0 1 0 560 430Z" fill="#FCD34D"/>
